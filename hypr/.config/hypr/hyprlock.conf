# Suspend
label {
    font_family = Comfortaa
    text = <span> Exit 󰩈 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = hyprctl dispatch exit
    position = -100, 100
    halign = right
    valign = bottom
}
