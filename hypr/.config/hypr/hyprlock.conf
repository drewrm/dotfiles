 BACKGROUND
background {
    monitor =
    path = ~/Pictures/hyprlock.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.5172
    vibrancy = 0.1696
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A"), $(date +"%d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 80
    font_family = Comfortaa
    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M:%S")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 60
    font_family = Comfortaa
    position = 0, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 400, 80
    color = rgba(0, 0, 0, 0.8)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 20
    font_family = Comfortaa
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 80
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(0,0,0, 0.7)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Comfortaa
    placeholder_text = <i><span foreground="##ffffff99">    Password</span></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

