unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mouse on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB" # For true color support

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin '2kabhishek/tmux2k'
set -g @tmux2k-theme 'onedark'
set -g @tmux2k-right-plugins 'cpu ram network weather time'
set -g @tmux2k-time-format '%a %H:%M'
set -g @tmux2k-weather-display-condition 'false'
set -g @tmux2k-weather-display-location 'true'
set -g @tmux2k-weather-location 'Sydney'

run '~/.tmux/plugins/tpm/tpm'
